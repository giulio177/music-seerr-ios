name: iOS build

# Builds an unsigned .ipa on a macOS runner. AltStore / SideStore sign it on install
# with the user's own Apple ID, so no Apple Developer account or certificate is needed.
#
# - push to main / pull request: release build, uploaded as a workflow artifact
# - tag vX.Y.Z: release build published as a GitHub release, plus the AltStore source
# - manual run: choose release or development (Expo dev client, loads JS from `npx expo start`)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        options: [release, development]
        default: release

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VARIANT: ${{ inputs.variant || 'release' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and lint
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          fi
          echo "APP_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build
        run: |
          if [ "$VARIANT" = development ]; then CONFIG=Debug; else CONFIG=Release; fi
          set -o pipefail
          xcodebuild \
            -workspace ios/MusicSeerr.xcworkspace \
            -scheme MusicSeerr \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80
          mkdir -p Payload
          cp -R "build/Build/Products/${CONFIG}-iphoneos/MusicSeerr.app" Payload/
          SUFFIX=$([ "$VARIANT" = development ] && echo "-dev" || echo "")
          IPA="MusicSeerr${SUFFIX}.ipa"
          zip -qry "$IPA" Payload
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: MusicSeerr-${{ env.VARIANT }}-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: ${{ env.IPA }}
          retention-days: 30

      - name: AltStore source
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/altstore-source.mjs "$IPA" > altstore-source.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$IPA" altstore-source.json \
            --title "Music Seerr iOS $APP_VERSION" --generate-notes
