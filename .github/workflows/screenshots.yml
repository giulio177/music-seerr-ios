name: Screenshots

# Runs the app in the iOS Simulator against the mock server and captures every screen with Maestro.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Sonalis.xcworkspace \
            -scheme Sonalis \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            build | tail -n 40

      - name: Boot an Italian iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone [0-9]+ Pro$"))] | last | .udid')
          [ "$UDID" = null ] && UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl spawn "$UDID" defaults write "Apple Global Domain" AppleLanguages -array it-IT
          xcrun simctl spawn "$UDID" defaults write "Apple Global Domain" AppleLocale -string it_IT
          xcrun simctl shutdown "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Sonalis.app

      - name: Start the mock server
        run: |
          nohup node scripts/mock-server.mjs 8787 > mock-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/health && exit 0; sleep 1; done
          cat mock-server.log; exit 1

      - name: Smoke launch
        run: |
          mkdir -p screenshots
          (xcrun simctl launch --console-pty "$UDID" io.github.giulio177.sonalis > screenshots/console.log 2>&1 &)
          sleep 25
          xcrun simctl io "$UDID" screenshot screenshots/00-smoke.png
          xcrun simctl spawn "$UDID" launchctl list | grep -i sonalis || echo "APP NOT RUNNING"
          echo "--- console"; tail -n 80 screenshots/console.log
          echo "--- crash reports"
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i sonalis | head -3 | while read f; do
            cp ~/Library/Logs/DiagnosticReports/"$f" screenshots/
            head -c 6000 ~/Library/Logs/DiagnosticReports/"$f"
          done
          xcrun simctl terminate "$UDID" io.github.giulio177.sonalis || true

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Capture screens
        run: maestro --device "$UDID" test .maestro/screenshots.yaml

      - name: Final screen on failure
        if: failure()
        run: |
          mkdir -p screenshots
          xcrun simctl io "$UDID" screenshot screenshots/zz-failure.png
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "Sonalis" OR subsystem == "com.facebook.react.log"' > screenshots/app.log || true
          tail -n 150 screenshots/app.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/
            mock-server.log
            ~/.maestro/tests/
