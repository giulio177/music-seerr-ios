# Walks through the app against scripts/mock-server.mjs (port 8787) with the simulator in Italian,
# saving a screenshot of each screen. Run by .github/workflows/screenshots.yml.
appId: io.github.giulio177.musicseerr
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: login-server
    timeout: 90000
- takeScreenshot: screenshots/01-login
- tapOn:
    id: login-server
- inputText: 127.0.0.1:8787
- tapOn:
    id: login-username
- inputText: giulio
- tapOn:
    id: login-password
- inputText: password
- hideKeyboard
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible: Late Night Drive
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: screenshots/02-library-playlists
- tapOn:
    text: Album
    optional: true
- extendedWaitUntil:
    visible: Midnight Transit
    timeout: 15000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: screenshots/03-library-albums
- tapOn:
    text: Midnight Transit
    optional: true
- extendedWaitUntil:
    visible: Glass Avenue
    timeout: 15000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: screenshots/04-album
- tapOn:
    text: Glass Avenue
    optional: true
- swipe:
    start: 50%, 40%
    end: 50%, 75%
    optional: true
- waitForAnimationToEnd
- takeScreenshot: screenshots/05-album-playing
- tapOn:
    id: mini-player
    optional: true
- waitForAnimationToEnd
- takeScreenshot: screenshots/06-player
- tapOn:
    id: player-chatbox-ellipses-outline
    optional: true
- swipe:
    start: 50%, 50%
    end: 50%, 50%
    duration: 6000
    optional: true
- takeScreenshot: screenshots/07-lyrics
- tapOn:
    id: player-list
    optional: true
- waitForAnimationToEnd
- takeScreenshot: screenshots/08-queue
- swipe:
    start: 50%, 12%
    end: 50%, 95%
    duration: 400
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: Cerca
    index: 0
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: Brani, artisti, album
    optional: true
- inputText: glass
- extendedWaitUntil:
    visible: Catalogo
    timeout: 15000
    optional: true
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: screenshots/09-search
- tapOn:
    text: Scaricati
    optional: true
- waitForAnimationToEnd
- takeScreenshot: screenshots/10-downloads
- tapOn:
    text: Impostazioni
    optional: true
- waitForAnimationToEnd
- takeScreenshot: screenshots/11-settings
